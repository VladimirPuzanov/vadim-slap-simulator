  unlockTool(id){if(!TOOLS[id])throw new Error('Неизвестный инструмент: '+id);owned.add(id);threshold=Math.max(threshold,TOOLS[id].minHP||0);render();return [...owned];},
  unlockAll(){for(const id of Object.keys(TOOLS))owned.add(id);threshold=Math.max(threshold,...Object.values(TOOLS).map(t=>t.minHP||0));render();return [...owned];},
  equip(id){if(!TOOLS[id])throw new Error('Неизвестный инструмент: '+id);owned.add(id);equipped=id;threshold=Math.max(threshold,TOOLS[id].minHP||0);render();return equipped;},
  reset(){$('reset').click();return 'ok';},
  state(){return {coins,total,combo,falls,damage,threshold,equipped,owned:[...owned],down};},
  help(){console.log('Команды: slapSim.addCoins(100000), slapSim.setCoins(5000), slapSim.unlockTool("nuke"), slapSim.unlockAll(), slapSim.equip("machine"), slapSim.state()');return this.state();}
};
Object.defineProperty(devAPI,'coins',{get:()=>coins,set:v=>{coins=Math.max(0,Math.trunc(Number(v)||0));render();}});
if(CONFIG.devTools){
Object.defineProperty(window,'slapSim',{value:devAPI,configurable:false,writable:false});
Object.defineProperty(window,'cheats',{value:devAPI,configurable:false,writable:false});
console.info('slapSim готов. Примеры: slapSim.addCoins(100000); slapSim.unlockAll(); slapSim.equip("nuke"); slapSim.state();');
}
render();
</script></body></html>
