<style>
*{box-sizing:border-box} :root{color-scheme:dark;--ink:#f2f1e8;--muted:#9da3a8;--accent:#f6c94e}body{margin:0;background:#11151a;color:var(--ink);font-family:system-ui,-apple-system,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}button{font:inherit;color:inherit;cursor:pointer} .game{height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 50% 68%,#30383b 0%,#1b2228 42%,#101419 82%)} .game:before{content:'';position:absolute;inset:0;z-index:-1;opacity:.17;background-image:linear-gradient(#ffffff12 1px,transparent 1px),linear-gradient(90deg,#ffffff12 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(transparent,#000)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding: max(18px,env(safe-area-inset-top)) clamp(16px,4vw,48px) 16px;z-index:4;pointer-events:none}header button{pointer-events:auto} .eyebrow{font-size:11px;font-weight:800;letter-spacing:.17em;color:var(--accent)}h1{font-size:clamp(18px,3.6vw,32px);letter-spacing:-.045em;margin:5px 0 0;line-height:1.05} .buttons{display:flex;gap:8px}.control{border:1px solid #ffffff24;background:#1e252c;border-radius:12px;padding:10px 13px;font-size:13px;white-space:nowrap}.control:hover{background:#303840}.control:focus-visible,.stage:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}.stats{display:flex;gap:0;align-self:center;border:1px solid #ffffff20;background:#151a20dc;border-radius:16px;padding:12px 0;z-index:3;pointer-events:none;box-shadow:0 8px 30px #0002}.stat{padding:0 clamp(17px,5vw,39px);min-width:90px;text-align:center}.stat+.stat{border-left:1px solid #ffffff1a}.stat span{display:block;font-size:10px;font-weight:700;letter-spacing:.11em;color:var(--muted);text-transform:uppercase}.stat b{font-size:clamp(23px,5vw,35px);font-variant-numeric:tabular-nums;line-height:1.2}.stat:nth-child(2) b{color:var(--accent)}.stage{position:relative;flex:1;min-height:0;touch-action:manipulation;cursor:crosshair;outline:none;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}.target{position:absolute;bottom:0;height:min(94%,660px);max-width:92%;aspect-ratio:372/719;transform-origin:50% 100%;pointer-events:none;will-change:transform;filter:drop-shadow(0 12px 24px #0008)}.target img{display:block;width:100%;height:100%;object-fit:contain;object-position:center bottom;pointer-events:none;-webkit-user-drag:none}.stage .floor{position:absolute;bottom:0;left:0;right:0;height:1px;background:#ffffff30}.meter{width:min(390px,80vw);align-self:center;padding:14px 0 7px;pointer-events:none;z-index:3}.meter-label{display:flex;justify-content:space-between;font-size:10px;font-weight:800;letter-spacing:.13em;color:var(--muted);margin-bottom:7px}.track{height:7px;background:#ffffff14;border-radius:10px;overflow:hidden}.fill{height:100%;width:0%;background:linear-gradient(90deg,#e8bc46,#ff9857,#ef5a4c);border-radius:10px;transition:width .09s linear}.hint{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.02em;color:#c9cdd2;pointer-events:none;z-index:2;text-shadow:0 2px 10px #000}.impact{position:absolute;pointer-events:none;z-index:3;transform:translate(-50%,-50%);font-weight:1000;font-style:italic;color:#ffdb61;text-shadow:2px 3px #17191c,-1px -1px #17191c;font-size:clamp(28px,6vw,54px);animation:pop .48s ease-out forwards;white-space:nowrap}.spark{position:absolute;pointer-events:none;z-index:3;width:4px;height:15px;border-radius:3px;background:#ffdd67;animation:spark .35s ease-out forwards}.flash{position:absolute;inset:0;background:#fff0ae;opacity:0;pointer-events:none;z-index:1}.flash.on{animation:flash .17s ease-out}.ko{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:9px;text-align:center;pointer-events:none;opacity:0;transform:scale(.85);transition:opacity .2s,transform .25s;z-index:4}.ko.visible{opacity:1;transform:scale(1)}.ko strong{font-size:clamp(36px,9vw,78px);line-height:.95;font-weight:1000;letter-spacing:-.06em;color:var(--accent);text-shadow:0 5px #0007}.ko small{color:#e2e2e2;font-size:13px}.footer{padding:10px 15px max(13px,env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:center;font-size:11px;color:#8f969e;background:#14191e;z-index:4;letter-spacing:.06em}.footer span{color:#d6d7d2}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(-14deg)}20%{opacity:1;transform:translate(-50%,-65%) scale(1.18) rotate(-8deg)}100%{opacity:0;transform:translate(-50%,-150%) scale(.9) rotate(5deg)}}@keyframes spark{from{opacity:1;transform:translate(-50%,-50%) rotate(var(--a)) translateY(-12px)}to{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateY(-64px) scale(.25)}}@keyframes flash{0%{opacity:.16}100%{opacity:0}}@media(max-width:480px){header{align-items:flex-start}.control{padding:9px;font-size:12px}.eyebrow{font-size:9px}.stats{padding:8px 0}.stat{min-width:76px;padding:0 14px}.target{height:min(91%,620px)}.hint{font-size:11px}}@media(prefers-reduced-motion:reduce){.flash,.spark{display:none}.impact{animation-duration:.2s}}

olite"></div></main>
<script>
'use strict';
const $=id=>document.getElementById(id); const stage=$('stage'),target=$('target'),flash=$('flash'),ko=$('ko');
const THRESHOLD=8, WINDOW=720; let total=0,combo=0,falls=0,last=0,down=false,muted=false,audio=null,comboTimer=null,returnTimer=null,motion=null; const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function render(){ $('total').textContent=total; $('combo').textContent='×'+combo; $('falls').textContent=falls; $('fill').style.width=(combo/THRESHOLD*100)+'%'; $('percent').textContent=Math.max(0,Math.round(100-combo/THRESHOLD*100))+'%'; }
function sound(fall=false){if(muted)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return; audio ||= new AC(); if(audio.state==='suspended')audio.resume().catch(()=>{}); const t=audio.currentTime,d=fall?.25:.115;const buf=audio.createBuffer(1,Math.ceil(audio.sampleRate*d),audio.sampleRate),data=buf.getChannelData(0); for(let i=0;i<data.length;i++){const s=i/audio.sampleRate;data[i]=(Math.random()*2-1)*Math.exp(-s/(fall?.065:.022));}const src=audio.createBufferSource(),hp=audio.createBiquadFilter(),g=audio.createGain();src.buffer=buf;hp.type='bandpass';hp.frequency.value=fall?650:1700+Math.random()*900;hp.Q.value=.65;g.gain.value=fall?.7:.8;src.connect(hp).connect(g).connect(audio.destination);src.start(t);const o=audio.createOscillator(),og=audio.createGain();o.type='sine';o.frequency.setValueAtTime(fall?150:250,t);o.frequency.exponentialRampToValueAtTime(fall?40:85,t+.09);og.gain.setValueAtTime(.28,t);og.gain.exponentialRampToValueAtTime(.001,t+.10);o.connect(og).connect(audio.destination);o.start(t);o.stop(t+.105);}catch(e){console.warn('Audio unavailable',e)}}
function animate(frames,options){if(motion)motion.cancel();motion=target.animate(frames,options);return motion;}
function effect(x,y){const words=['ХЛОП!','ШЛЁП!','БАЦ!','ПАХ!'];const node=document.createElement('div');node.className='impact';node.textContent=words[Math.floor(Math.random()*words.length)];node.style.left=x+'px';node.style.top=y+'px';stage.append(node);node.addEventListener('animationend',()=>node.remove(),{once:true});if(!reduced){for(let i=0;i<8;i++){const s=document.createElement('i');s.className='spark';s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--a',(i*45+Math.random()*20)+'deg');stage.append(s);s.addEventListener('animationend',()=>s.remove(),{once:true});}flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');}}
function fall(dir){down=true;falls++;render();sound(true);$('announce').textContent='Персонаж упал';const distance=stage.clientHeight+target.clientHeight;animate([{transform:'translateY(0) rotate(0)'},{transform:`translate(${dir*36}px, -12px) rotate(${dir*18}deg)`,offset:.2},{transform:`translate(${dir*80}px, ${distance}px) rotate(${dir*65}deg)`}],{duration:reduced?120:570,easing:'cubic-bezier(.5,.05,.8,.55)',fill:'forwards'});ko.classList.add('visible');returnTimer=setTimeout(()=>{ko.classList.remove('visible');combo=0;last=0;render();animate([{transform:`translateY(${distance}px)`},{transform:'translateY(0)'}],{duration:reduced?100:420,easing:'cubic-bezier(.2,.8,.25,1)',fill:'forwards'});returnTimer=setTimeout(()=>{down=false;},reduced?100:420);},1450);}
function hit(e){if(down)return;const now=performance.now();combo=now-last<=WINDOW?combo+1:1;last=now;total++;clearTimeout(comboTimer);const r=stage.getBoundingClientRect(),tr=target.getBoundingClientRect();const x=e?.clientX!=null?e.clientX-r.left:tr.left-r.left+tr.width*.55;const y=e?.clientY!=null?e.clientY-r.top:tr.top-r.top+tr.height*.25;const dir=x<r.width/2?1:-1;render();effect(Math.max(44,Math.min(r.width-44,x)),Math.max(35,Math.min(r.height-28,y)));sound();if(combo>=THRESHOLD){fall(dir);return;} const force=4+combo*1.8;animate([{transform:'translate(0,0) rotate(0)'},{transform:`translate(${dir*force*2}px, 8px) rotate(${dir*force}deg) scale(.99, .97)`,offset:.19},{transform:`translate(${-dir*force*.6}px, 0) rotate(${-dir*force*.35}deg)`,offset:.55},{transform:'translate(0,0) rotate(0)'}],{duration:reduced?120:360,easing:'ease-out'});comboTimer=setTimeout(()=>{combo=0;render();},WINDOW);}
stage.addEventListener('pointerdown',e=>{if(e.isPrimary&&e.button===0){e.preventDefault();hit(e);}});document.addEventListener('keydown',e=>{if((e.code==='Space'||(e.code==='Enter'&&document.activeElement===stage))&&!e.repeat&&!['BUTTON','INPUT'].includes(document.activeElement?.tagName)){e.preventDefault();hit();}});$('sound').addEventListener('click',()=>{muted=!muted;$('sound').textContent=muted?'🔇 Звук':'🔊 Звук';$('sound').setAttribute('aria-pressed',String(!muted));});$('reset').addEventListener('click',()=>{clearTimeout(comboTimer);clearTimeout(returnTimer);if(motion)motion.cancel();stage.querySelectorAll('.impact,.spark').forEach(n=>n.remove());ko.classList.remove('visible');total=combo=falls=last=0;down=false;render();});render();
</script></body></html>
